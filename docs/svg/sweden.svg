<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" role="img" aria-labelledby="title desc">
  <title id="title">Sweden flag</title>
  <desc id="desc">Blue flag with a yellow Nordic cross.</desc>
  <defs>
    <clipPath id="clip">
      <rect width="64" height="48" rx="4" ry="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="64" height="48" fill="#006aa7"/>
    <rect x="18" y="0" width="8" height="48" fill="#fecc00"/>
    <rect x="0" y="20" width="64" height="8" fill="#fecc00"/>
  </g>
  <rect width="64" height="48" rx="4" ry="4" fill="none" stroke="#d0d7de"/>
</svg>
