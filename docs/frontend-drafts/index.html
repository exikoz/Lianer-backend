<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lianer Fullstack Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .status-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .url-line {
            margin: 5px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .url-label {
            color: #94a3b8;
        }
        .url-val {
            color: #34d399;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #7dd3fc;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #020617;
            border-radius: 6px;
            min-height: 50px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            border: 1px dashed #475569;
        }
    </style>
    <!-- Load configuration before main scripts -->
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Lianer Frontend (Vanilla JS) Verification</h1>
        <div class="status-box">
            <div class="url-line">
                <span class="url-label">Core API URL:</span> 
                <span class="url-val" id="core-url">Loading...</span>
            </div>
            <div class="url-line">
                <span class="url-label">Features API URL:</span> 
                <span class="url-val" id="features-url">Loading...</span>
            </div>
        </div>
        <button onclick="testApis()">Verify Connection to API Containers</button>
        <div id="output">Click the button to test API connection...</div>
    </div>

    <script>
        // Set UI values from config
        document.getElementById('core-url').textContent = window.ENV?.CORE_API_URL || 'Not Configured';
        document.getElementById('features-url').textContent = window.ENV?.FEATURES_API_URL || 'Not Configured';

        async function testApis() {
            const outDiv = document.getElementById('output');
            outDiv.textContent = 'Testing connection...\n';
            
            const coreUrl = window.ENV?.CORE_API_URL;
            const featuresUrl = window.ENV?.FEATURES_API_URL;
            
            try {
                outDiv.textContent += `1. Fetching users list from Core API (${coreUrl}/api/v1/users)... `;
                const coreRes = await fetch(`${coreUrl}/api/v1/users`);
                outDiv.textContent += `Status: ${coreRes.status} ${coreRes.statusText}\n`;
                if (coreRes.ok) {
                    const users = await coreRes.json();
                    outDiv.textContent += `   Success! Found ${users.length} users.\n`;
                }
            } catch (err) {
                outDiv.textContent += `FAILED: ${err.message}\n`;
            }

            try {
                outDiv.textContent += `2. Fetching leads list from Features API (${featuresUrl}/api/v1/leads)... `;
                const featRes = await fetch(`${featuresUrl}/api/v1/leads`);
                outDiv.textContent += `Status: ${featRes.status} ${featRes.statusText}\n`;
                if (featRes.ok) {
                    const leads = await featRes.json();
                    outDiv.textContent += `   Success! Found ${leads.length} leads.\n`;
                }
            } catch (err) {
                outDiv.textContent += `FAILED: ${err.message}\n`;
            }
        }
    </script>
</body>
</html>
